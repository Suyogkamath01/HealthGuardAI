name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The unit tests only exercise config, preprocessing, risk scoring and
        # the recommendation rules - no gradient boosters needed, so we keep CI
        # fast and reliable by installing just what the tests import.
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn matplotlib joblib pytest

      - name: Run unit tests
        # Tests that need the raw dataset are skipped gracefully if absent.
        run: pytest tests/ -q
